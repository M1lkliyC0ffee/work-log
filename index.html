<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>工作日志 · 原型</title>
<style>
  :root {
    --bg: #FAF6EF; --card: #FFFFFF; --text: #2C2A26; --muted: #8A8278;
    --accent: #4A7C59; --accent-dark: #3A6347; --brown: #C19A6B;
    --border: #EAE2D4; --danger: #B5574A;
    --shadow: 0 1px 2px rgba(60,45,20,.05), 0 4px 18px rgba(60,45,20,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif; line-height: 1.6; }
  .serif { font-family: Georgia, "Songti SC", "STSong", "SimSun", serif; }
  button { font-family: inherit; cursor: pointer; }

  .app { max-width: 460px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  #app[hidden] { display: none; }

  header.top { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px;
    position: sticky; top: 0; z-index: 10; background: rgba(250,246,239,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  header.top h1 { font-size: 21px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  .gear { border: none; background: transparent; font-size: 20px; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
  .gear:active { background: var(--border); }

  main { flex: 1; padding: 16px 20px 100px; }
  .date-line { font-size: 14px; color: var(--muted); margin: 4px 0 14px; }
  .date-line b { color: var(--accent-dark); font-weight: 600; }

  .field { margin-bottom: 16px; }
  .field label { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--accent-dark); font-weight: 600; letter-spacing: .3px; margin-bottom: 7px; gap: 8px; }
  .field label .hint { color: var(--muted); font-weight: 400; font-size: 12px; }

  textarea, input[type=text], input[type=email], input[type=date], input[type=password] {
    width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    font-size: 15px; color: var(--text); background: var(--card); font-family: inherit; resize: none; outline: none;
    box-shadow: inset 0 1px 2px rgba(60,45,20,.03); }
  textarea:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,124,89,.12); }
  textarea { min-height: 132px; }

  .trans-btn { border: 1px solid var(--border); background: var(--card); color: var(--accent-dark); font-size: 12px; padding: 4px 10px; border-radius: 999px; letter-spacing: .3px; white-space: nowrap; }
  .trans-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .trans-panel { display: none; margin-top: 8px; border: 1px dashed var(--brown); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #6b5b3f; background: #FBF7EE; }
  .trans-panel.show { display: block; }
  .trans-panel .tag { font-size: 11px; color: var(--brown); letter-spacing: .3px; display: block; margin-bottom: 3px; }

  .mood-row { display: flex; gap: 10px; }
  .mood-btn { flex: 1; height: 46px; font-size: 22px; border: 1px solid var(--border); background: var(--card); border-radius: 12px; display: grid; place-items: center; }
  .mood-btn.sel { border-color: var(--accent); background: #F0F5F1; box-shadow: 0 0 0 3px rgba(74,124,89,.12); }
  .star-row { display: flex; gap: 6px; }
  .star { font-size: 28px; color: var(--border); background: none; border: none; padding: 0 2px; }
  .star.on { color: var(--brown); }

  .btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 600; letter-spacing: 1px; background: var(--accent); color: #fff; }
  .btn:active { background: var(--accent-dark); }
  .btn.ghost { background: transparent; color: var(--accent-dark); border: 1px solid var(--accent); }
  .btn.small { width: auto; display: inline-block; padding: 9px 16px; font-size: 13px; border-radius: 11px; }
  .btn:disabled { opacity: .45; }

  /* 记录 accordion */
  .task-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .task-head { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; }
  .task-head .chev { transition: transform .2s; color: var(--muted); font-size: 14px; }
  .task-card.open .task-head .chev { transform: rotate(180deg); }
  .task-head .task-title { flex: 1; font-weight: 600; font-size: 15px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-del { border: none; background: transparent; color: var(--muted); font-size: 16px; padding: 6px; }
  .task-body { display: none; padding: 2px 14px 14px; border-top: 1px solid var(--border); }
  .task-card.open .task-body { display: block; }
  .task-body .field:last-child { margin-bottom: 0; }
  .add-task { width: 100%; border: 1px dashed var(--accent); background: transparent; color: var(--accent-dark); padding: 12px; border-radius: 14px; font-size: 14px; font-weight: 600; }

  /* dashboard */
  .dash-hero { background: #F0F5F1; border: 1px solid #D4E2D8; border-radius: 18px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .hero-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .hero-tag { font-size: 12px; color: var(--accent-dark); font-weight: 700; letter-spacing: .5px; }
  .hero-week { font-size: 12px; color: var(--muted); }
  .hero-item { font-size: 16px; font-weight: 600; margin: 12px 0 14px; line-height: 1.5; }
  .hero-foot { display: flex; gap: 10px; }

  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 10px; text-align: center; box-shadow: var(--shadow); }
  .stat .n { font-size: 22px; font-weight: 700; color: var(--accent-dark); }
  .stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .dash-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .dash-card h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent-dark); }
  .dash-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 4px 0; }
  .dash-row b { color: var(--text); }
  .line { font-size: 14px; margin: 3px 0; }

  /* 计划：可折叠日历 + 周卡片 */
  .cal-collapse { margin-bottom: 16px; }
  .cal-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 15px; font-weight: 600; color: var(--text); box-shadow: var(--shadow); }
  .cal-toggle .chev { transition: transform .2s; color: var(--muted); }
  .cal-collapse.open .cal-toggle .chev { transform: rotate(180deg); }
  .cal-collapse .cal-card { display: none; }
  .cal-collapse.open .cal-card { display: block; margin-top: 12px; }

  .cal-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head .mon { font-weight: 700; font-size: 16px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-grid .wd { font-size: 11px; color: var(--muted); padding: 4px 0; }
  .cal-grid .day { aspect-ratio: 1; display: grid; place-items: center; border-radius: 9px; font-size: 13px; }
  .cal-grid .day.blank { }
  .cal-grid .day.future { color: var(--border); }
  .cal-grid .day.today { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 700; }
  .cal-grid .day.done { background: var(--accent); color: #fff; }
  .cal-streak { margin-top: 12px; font-size: 13px; color: var(--accent-dark); display: flex; align-items: center; justify-content: space-between; }

  .week-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .week-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
  .week-head .chev { color: var(--muted); font-size: 14px; transition: transform .2s; }
  .week-card.open .week-head .chev { transform: rotate(180deg); }
  .week-head .wk-title { flex: 1; }
  .week-head .wk-title .t { font-weight: 600; font-size: 15px; }
  .week-head .wk-title .p { font-size: 12px; color: var(--muted); }
  .week-head .cnt { font-size: 12px; color: var(--muted); }
  .week-body { display: none; padding: 2px 16px 14px; border-top: 1px solid var(--border); }
  .week-card.open .week-body { display: block; }
  .progress { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .plan-item { display: block; padding: 10px 2px; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .plan-item-top { display: flex; align-items: center; gap: 8px; }
  .plan-item-title { display: flex; align-items: center; gap: 8px; flex: 1; text-align: left; background: none; border: none; padding: 0; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; min-width: 0; }
  .pi-check { min-width: 16px; flex: none; color: var(--accent); font-weight: 700; }
  .pi-text { flex: 1; }
  .plan-item.done .pi-text { color: var(--muted); text-decoration: line-through; }
  .pi-chev { color: var(--muted); font-size: 12px; flex: none; }
  .plan-del { border: none; background: transparent; color: var(--muted); font-size: 14px; padding: 2px 6px; flex: none; }
  .plan-detail { display: none; margin: 10px 0 4px; padding: 12px; background: #FAF8F3; border: 1px solid var(--border); border-radius: 12px; }
  .plan-detail.open { display: block; }
  .vprog { display: flex; gap: 10px; align-items: stretch; margin-bottom: 12px; }
  .vprog-track { width: 10px; min-height: 52px; background: var(--border); border-radius: 99px; overflow: hidden; flex: none; }
  .vprog-track > i { display: block; width: 100%; background: var(--accent); border-radius: 99px; transition: height .3s; }
  .vprog-body { flex: 1; }
  .vprog-label { font-size: 12px; font-weight: 600; color: var(--accent-dark); }
  .vprog-hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pd-block { margin-bottom: 12px; }
  .pd-block:last-child { margin-bottom: 0; }
  .pd-label { font-size: 12px; font-weight: 600; color: var(--accent-dark); margin-bottom: 5px; }
  .pd-sub { font-weight: 400; color: var(--muted); }
  .pd-explain { font-size: 13px; color: #5c5347; line-height: 1.7; }
  .pd-mats { margin: 0; padding: 0; list-style: none; }
  .mat-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .mat-item:last-child { border-bottom: none; }
  .mat-item input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .mat-body { flex: 1; font-size: 13px; line-height: 1.6; }
  .mat-title { font-weight: 600; }
  .mat-title a { color: var(--accent-dark); }
  .mat-item.done .mat-title { color: var(--muted); text-decoration: line-through; }
  .mat-d { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: pre-line; }
  .pd-notes, .pd-review { width: 100%; min-height: 74px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; background: #fff; resize: vertical; }
  .pd-imgs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .img-thumb { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #fff; }
  .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-thumb button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border: none; border-radius: 50%; background: rgba(44,42,38,.6); color: #fff; font-size: 11px; line-height: 1; }
  .pd-upload { display: inline-block; border: 1px dashed var(--accent); color: var(--accent-dark); font-size: 12px; padding: 6px 12px; border-radius: 10px; cursor: pointer; }

  .add-plan { display: flex; gap: 10px; margin-top: 16px; }
  .add-plan input { flex: 1; }
  .add-plan select { flex: none; width: auto; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 13px; background: var(--card); color: var(--text); }
  .cat-block { margin-bottom: 6px; }
  .cat-head { display: flex; align-items: center; gap: 8px; padding: 12px 4px 6px; }
  .cat-icon { font-size: 18px; }
  .cat-name { font-weight: 700; font-size: 15px; color: var(--text); }
  .cat-cnt { margin-left: auto; font-size: 12px; color: var(--muted); }
  .hero-line { font-size: 12px; color: var(--muted); margin: 6px 0; }
  .learned-group { margin-bottom: 16px; }
  .learned-head { font-size: 13px; font-weight: 700; color: var(--accent-dark); margin-bottom: 8px; }
  .learned-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .learned-title { font-weight: 600; font-size: 14px; }
  .learned-when { font-weight: 400; color: var(--muted); font-size: 12px; }
  .learned-notes { font-size: 13px; color: #5c5347; margin-top: 6px; line-height: 1.6; }
  .learned-review { font-size: 13px; color: var(--accent-dark); margin-top: 6px; }

  /* AI 建议 */
  .ai-btn { margin: 14px 0; }
  .ai-loading { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 0; }
  .sug-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .sug-top { display: flex; align-items: flex-start; gap: 10px; }
  .sug-cat { font-size: 20px; line-height: 1.2; }
  .sug-title { font-weight: 700; font-size: 15px; }
  .sug-cat-name { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .sug-why { font-size: 13px; color: #5c5347; margin: 10px 0 6px; line-height: 1.6; }
  .sug-why b { color: var(--accent-dark); }
  .sug-steps { margin: 0; padding: 0 0 0 18px; font-size: 13px; color: #5c5347; line-height: 1.6; }
  .sug-steps li { margin: 3px 0; }
  .sug-add { margin-top: 12px; }

  /* 分类管理 */
  .cat-seg button.cat-add { flex: none; width: 40px; padding: 6px 0; color: var(--accent-dark); font-weight: 700; font-size: 15px; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .emoji-row button { font-size: 20px; width: 42px; height: 42px; border: 1px solid var(--border); background: var(--card); border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
  .emoji-row button.sel { border-color: var(--accent); background: #F0F5F1; box-shadow: 0 0 0 3px rgba(74,124,89,.12); }
  .cat-list-item { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .cat-list-item .del { margin-left: auto; border: none; background: transparent; color: var(--danger); font-size: 14px; padding: 4px 8px; }

  /* 历史 */
  .entry-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .entry-card .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .entry-card .d { font-weight: 600; color: var(--accent-dark); font-size: 14px; }
  .entry-card .mood { font-size: 15px; }
  .entry-card .ops { display: flex; gap: 8px; margin-top: 10px; }
  .entry-card .ops button { font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--muted); }
  .entry-card .ops button.del { color: var(--danger); border-color: #EBD3CD; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; }

  /* 周报 */
  .report-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 14px; white-space: pre-wrap; font-size: 14px; box-shadow: var(--shadow); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
  .seg button { border: none; background: transparent; padding: 6px 14px; font-size: 13px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }
  .cat-seg { display: flex; width: 100%; }
  .cat-seg button { flex: 1; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* 底部导航 */
  nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; max-width: 460px; margin: 0 auto;
    display: flex; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-top: 1px solid var(--border);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex: 1; border: none; background: transparent; padding: 7px 0; font-size: 12px; color: var(--muted); border-radius: 10px; letter-spacing: .3px; }
  nav.tabs button .ic { display: block; font-size: 20px; line-height: 1.2; }
  nav.tabs button.on { color: var(--accent-dark); font-weight: 600; }

  /* 密码门 */
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gate-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); padding: 32px 26px 28px; text-align: center; }
  .gate-card .mark { font-size: 44px; line-height: 1; }
  .gate-card h1 { font-size: 24px; margin: 12px 0 4px; }
  .gate-card .sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
  .gate-card .field { text-align: left; }
  .gate-card input { padding: 14px 14px; font-size: 16px; }
  .gate-card .btn + .btn { margin-top: 10px; }
  .gate-card .err { color: var(--danger); font-size: 13px; min-height: 20px; margin: 12px 0 0; }

  /* 弹窗 */
  .modal-bg { position: fixed; inset: 0; background: rgba(44,42,38,.4); display: none; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--card); border-radius: 16px; padding: 22px; width: 100%; max-width: 360px; box-shadow: var(--shadow); }
  .modal h2 { margin: 0 0 14px; font-size: 18px; }
  .modal .field { margin-bottom: 12px; }

  #toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(20px); background: var(--text); color: #fff;
    padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 60; max-width: 80vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <!-- 登录门 -->
  <div id="gate">
    <div class="gate-card">
      <div class="mark">🗒️</div>
      <h1 class="serif">工作日志</h1>
      <p class="sub" id="gateMsg">登录后数据会自动云同步</p>
      <div class="field">
        <label for="gateEmail">邮箱</label>
        <input type="email" id="gateEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="gatePw">密码</label>
        <input type="password" id="gatePw" placeholder="至少 6 位" autocomplete="current-password">
      </div>
      <button class="btn" id="gateBtn">登录</button>
      <button class="btn ghost" id="gateSignupBtn">注册新账号</button>
      <p class="err" id="gateErr"></p>
    </div>
  </div>

  <!-- 主应用 -->
  <div class="app" id="app" hidden>
    <header class="top">
      <h1 class="serif">工作日志</h1>
      <button class="gear" id="gearBtn" title="设置">⚙️</button>
    </header>

    <main>
      <!-- 主页 dashboard -->
      <section id="view-dashboard">
        <div class="date-line" id="dashDate"></div>
        <div class="dash-hero" id="heroCard"></div>
        <div class="stats" id="statsRow"></div>
        <div class="cal-collapse" id="calCollapse">
          <button class="cal-toggle" id="calToggleBtn"><span id="calToggleLabel">📅 学习打卡</span><span class="chev">▾</span></button>
          <div class="cal-card" id="calCard"></div>
        </div>
        <div class="dash-card" id="todayCard"></div>
      </section>

      <!-- 记录 -->
      <section id="view-tasks" hidden>
        <div class="field">
          <label>日期</label>
          <input type="date" id="fDate">
        </div>
        <div id="taskList"></div>
        <button class="add-task" id="addTaskBtn">＋ 添加任务</button>
        <div style="height:14px"></div>
        <div class="field"><label>吐槽 <span class="hint">随便写 · 不进周报</span></label><textarea id="fVent" placeholder="例如：今天客户又让我改回第一版……（只有自己看得到）"></textarea></div>
        <div class="field"><label>心情</label><div class="mood-row" id="moodRow">

  function readImage(file, cb){
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 900;
        let w = img.width, h = img.height;
        const scale = Math.min(1, MAX / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => toast('图片读取失败');
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* ---------- 周范围 ---------- */
  function weekRange(){
    const now = new Date(); const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const day = (d.getDay()+6)%7; const start = new Date(d); start.setDate(d.getDate()-day);
    const end = new Date(start); end.setDate(start.getDate()+6); return {start,end};
  }
  const inWeek = e => { const {start,end}=weekRange(); const t=iso(parse(e.date)); return t>=iso(start)&&t<=iso(end); };
  const weekEntries = () => entries.filter(inWeek);

  const checkedToday = () => !!checkins[iso(new Date())];

  function catOf(id){ return CATS.find(c=>c.id===id); }
  function stageItems(si){ return STAGES[si].items.map((it,ii)=>({ key:'s'+si+'-'+ii, text: it.text, explain: it.explain, materials: it.materials, custom:false })); }
  function allItems(){
    const list = [];
    STAGES.forEach((st,si)=> st.items.forEach((it,ii)=> list.push({ key:'s'+si+'-'+ii, text: it.text, explain: it.explain, materials: it.materials, custom:false, catId: st.cat })));
    Object.keys(customItems).forEach(catId => (customItems[catId]||[]).forEach((text,j)=> list.push({ key:'c'+catId+'-'+j, text, explain:null, materials:null, custom:true, catId })));
    return list;
  }
  function planProgress(){

    allItems().forEach(it=>{ total++; if (planState[it.key]) done++; });
    return {total,done};

  function stageDoneCount(si){ return STAGES[si].items.filter((it,ii)=>planState['s'+si+'-'+ii]).length; }
  function currentStageIndex(){
    for (let si=0; si<STAGES.length; si++) if (STAGES[si].items.some((it,ii)=>!planState['s'+si+'-'+ii])) return si;
    return STAGES.length-1;
  }
  function nextItemInStage(si){
    for (let ii=0; ii<STAGES[si].items.length; ii++) if (!planState['s'+si+'-'+ii]) return STAGES[si].items[ii].text;
    return null;

  function weekDoneCount(){
    const {start,end}=weekRange();
    let n=0;
    allItems().forEach(it => {
      const v=planState[it.key];
      if (typeof v==='string' && v){ const t=iso(parse(v)); if (t>=iso(start) && t<=iso(end)) n++; }
    });
    return n;
  }
  function streakDays(){

        ${it.explain ? `<div class="pd-block"><div class="pd-label">📖 说明</div><div class="pd-explain">${esc(it.explain)}</div></div>` : ''}
        ${matsHtml}

      if (!file) return;
      readImage(file, dataURL => {
        const d = detailStore[key] = detailStore[key] || {};
        (d.images = d.images || []).push(dataURL);
        saveDetails();
        if (!openDetails) openDetails = new Set(); openDetails.add(key);
        renderPlan();
        toast('图片已保存 ✓');
      });
    }
  });
  let detailTimer = null;
  $('#planList').addEventListener('input', e => {
    if (e.target.matches('.pd-notes, .pd-review')) {
      const key = e.target.dataset.key, field = e.target.dataset.field;
      const d = detailStore[key] = detailStore[key] || {};
      d[field] = e.target.value;
      clearTimeout(detailTimer);
      detailTimer = setTimeout(saveDetails, 700);
    }
  });

  function renderCatSelectors(){
    $('#newPlanCat').innerHTML = CATS.map(c=>`<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('');
    $('#planCatSeg').innerHTML = CATS.map(c=>`<button data-cat="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('') + '<button data-cat="__add" class="cat-add" type="button" title="新增分类">＋</button>';
  }
  renderCatSelectors();
  $('#planCatSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.cat === '__add') { openCatModal(); return; }
    planCat = b.dataset.cat;
    renderPlan();
  });
  $('#addPlanBtn').onclick = () => {
    const txt = $('#newPlanInput').value.trim();
    if (!txt) { toast('先写点内容再添加'); return; }
    const catId = $('#newPlanCat').value || 'ai';
    (customItems[catId] = customItems[catId] || []).push(txt);
    $('#newPlanInput').value='';
    saveCustom(); renderPlan(); renderDashboard(); toast('已添加到「'+(catOf(catId)||{name:'自定义'}).name+'」✓');
  };
  $('#newPlanInput').addEventListener('keydown', e => { if (e.key==='Enter') $('#addPlanBtn').onclick(); });

  /* ---------- 分类管理 ---------- */
  const CAT_EMOJIS = ['🎨','🖌️','🏆','✍️','🎬','📱','📚','🧠','📷','🎧','💻','🖥','🔧','📝','✂️','🧩','🎮','🖊','🧵','🗂'];
  let selectedCatEmoji = '🎨';

  function openCatModal(){
    selectedCatEmoji = '🎨';
    $('#catNameInput').value = '';
    renderCatEmojiRow();
    renderCatManageList();
    $('#catModal').classList.add('show');
  }
  function renderCatEmojiRow(){
    $('#catEmojiRow').innerHTML = CAT_EMOJIS.map(e=>`<button type="button" data-emoji="${e}" class="${e===selectedCatEmoji?'sel':''}">${e}</button>`).join('');
  }
  function renderCatManageList(){
    const list = customCats;
    $('#catList').innerHTML = list.length
      ? list.map(c=>`<div class="cat-list-item"><span>${c.icon} ${esc(c.name)}</span><button class="del" data-delcat="${c.id}" type="button">删除</button></div>`).join('')
      : '<div class="note" style="margin-top:2px">还没有自定义分类。</div>';
  }

  $('#catEmojiRow').addEventListener('click', e => {
    const b = e.target.closest('[data-emoji]'); if (!b) return;
    selectedCatEmoji = b.dataset.emoji;
    renderCatEmojiRow();
  });
  $('#catAddOkBtn').onclick = () => {
    const name = $('#catNameInput').value.trim();
    if (!name) { toast('先给分类起个名字'); return; }
    const slug = 'cat' + uuid().replace(/-/g,'').slice(0, 10);
    customCats.push({ id: slug, name, icon: selectedCatEmoji });
    saveCats();
    rebuildCats();
    renderCatSelectors();
    planCat = slug;
    renderPlan(); renderDashboard();
    renderCatManageList();
    $('#catNameInput').value = '';
    toast('已添加分类「' + name + '」✓');
  };
  $('#catList').addEventListener('click', e => {
    const b = e.target.closest('[data-delcat]'); if (!b) return;
    const id = b.dataset.delcat;
    if (!confirm('删除该分类会连同它下面的计划一起删除，确定？')) return;
    customCats = customCats.filter(c => c.id !== id);
    if (customItems[id]) delete customItems[id];
    saveCats(); saveCustom();
    rebuildCats();
    renderCatSelectors();
    if (planCat === id) planCat = null;
    renderPlan(); renderDashboard(); renderLearned();
    renderCatManageList();
    toast('已删除分类');
  });
  $('#catCloseBtn').onclick = () => $('#catModal').classList.remove('show');

  /* ---------- 二次确认对话框 ---------- */
  let confirmCb = null;
  function askConfirm(title, msg, okLabel, cb){
    $('#confirmTitle').textContent = title;
    $('#confirmMsg').textContent = msg;
    $('#confirmOk').textContent = okLabel || '确认';
    confirmCb = cb;
    $('#confirmModal').classList.add('show');
  }
  $('#confirmOk').onclick = () => { const cb = confirmCb; confirmCb = null; $('#confirmModal').classList.remove('show'); if (cb) cb(); };
  $('#confirmCancel').onclick = () => { confirmCb = null; $('#confirmModal').classList.remove('show'); };

  /* ---------- AI：按记录定制计划 ---------- */
  let lastSuggestions = [];
  $('#aiSuggestBtn').onclick = () => {
    const wk = weekEntries();
    if (!wk.length) { toast('本周还没有记录，先去「记录」写几条吧'); return; }
    askConfirm('分析本周记录', '将把本周 ' + wk.length + ' 天的记录发给 AI 分析（会消耗少量 token），确认继续？', '确认分析', doSuggestPlan);
  };

  async function doSuggestPlan(){
    const btn = $('#aiSuggestBtn');
    btn.disabled = true; btn.textContent = '🤖 分析中…';
    $('#aiSuggestOut').innerHTML = '<div class="ai-loading">正在读取本周记录并生成练习建议，请稍候…</div>';

    const text = weekEntries().slice().sort((a,b)=> a.date<b.date?-1:1).map(e => {
      const lines = ['▎' + cnDate(parse(e.date))];
      (e.tasks||[]).forEach(t => {
        lines.push('　任务：' + (t.title||'(未命名)'));
        if (t.problems) lines.push('　　问题：' + t.problems);
        if (t.thoughts) lines.push('　　感想：' + t.thoughts);
      });
      return lines.join('\n');
    }).join('\n');

    try {
      const { data, error } = await supabase.functions.invoke('ai', { body: { task: 'suggest-plan', text } });
      if (error) throw error;
      renderSuggestions(data);
    } catch(err) {
      const msg = (err && err.message) ? err.message : '';
      $('#aiSuggestOut').innerHTML = '<div class="note" style="color:var(--danger)">生成失败' + (msg ? '（' + esc(msg) + '）' : '') + '。请确认：① AI 函数已部署 ② 已设置 DEEPSEEK_API_KEY ③ 已登录。</div>';
    } finally {
      btn.disabled = false; btn.textContent = '🤖 分析本周记录 · 生成练习建议';
    }
  }

  function renderSuggestions(data){
    const suggs = (data && data.suggestions) || [];
    lastSuggestions = suggs;
    if (!suggs.length) { $('#aiSuggestOut').innerHTML = '<div class="note">AI 这次没给出建议，补充一下「问题」描述后再试一次。</div>'; return; }
    $('#aiSuggestOut').innerHTML = suggs.map((s, i) => {
      const cat = catOf(s.cat) || catOf('ai');
      const steps = (s.steps||[]).map((st)=>`<li>${esc(st)}</li>`).join('');
      return `<div class="sug-card">
        <div class="sug-top"><span class="sug-cat">${cat.icon}</span><div><div class="sug-title">${esc(s.title)}</div><div class="sug-cat-name">${esc(cat.name)}</div></div></div>
        <div class="sug-why"><b>为什么练：</b>${esc(s.why || '')}</div>
        ${steps ? `<ol class="sug-steps">${steps}</ol>` : ''}
        <button class="btn small sug-add" data-si="${i}" type="button">＋ 加入计划</button>
      </div>`;
    }).join('');
  }

  $('#aiSuggestOut').addEventListener('click', e => {
    const b = e.target.closest('.sug-add'); if (!b) return;
    const sug = lastSuggestions[+b.dataset.si]; if (!sug) return;
    addSuggestion(sug);
    b.disabled = true; b.textContent = '已加入 ✓';
  });

  function addSuggestion(sug){
    const catId = ['ai','ps','kv'].includes(sug.cat) ? sug.cat : 'ai';
    (customItems[catId] = customItems[catId] || []).push(sug.title || '（未命名练习）');
    const key = 'c' + catId + '-' + (customItems[catId].length - 1);
    const d = detailStore[key] = detailStore[key] || {};
    d.notes = '🎯 为什么练：' + (sug.why || '') + '\n\n📝 步骤：\n' + ((sug.steps||[]).map((st,j)=>(j+1)+'. '+st).join('\n') || '（无）');
    saveCustom(); saveDetails();
    renderPlan(); renderDashboard();
    toast('已加入「' + (catOf(catId)||{name:'计划'}).name + '」✓');
  }

  /* ---------- dashboard ---------- */
  function renderDashboard(){
    $('#dashDate').innerHTML = '今天是 <b>'+cnDate(new Date())+'</b>';
    const si = currentStageIndex();
    const stage = STAGES[si];
    const next = nextItemInStage(si);
    const cat = catOf(stage.cat);
    const wTarget = WEEKLY_TARGET, wd = weekDoneCount();
    const wMet = wd >= wTarget;
    const {total,done} = planProgress();
    $('#heroCard').innerHTML = `
      <div class="hero-top"><span class="hero-tag">今日学习计划</span><span class="hero-week">${cat?cat.icon+' '+esc(cat.name):''} · ${esc(stage.title)}</span></div>
      <div class="hero-item">${next ? esc(next) : '🎉 全部计划已完成'}</div>
      <div class="hero-line">本周保底 ${wTarget} 项 · 已完成 ${Math.min(wd,wTarget)}/${wTarget} ${wMet?'已达标 ✓':''}${(wMet&&next)?' · 可超额练习':''}</div>
      <div class="hero-foot"><button class="btn ghost small" data-go="plan">去计划 →</button></div>`;
    const wk = weekEntries();
    $('#statsRow').innerHTML = `
      <div class="stat"><div class="n">${done}/${total}</div><div class="l">计划进度</div></div>
      <div class="stat"><div class="n">${wk.length}</div><div class="l">本周记录(天)</div></div>
      <div class="stat"><div class="n">${streakDays()}</div><div class="l">连续打卡(天)</div></div>`;
    const todayEntry = entries.find(x=>x.date===iso(new Date()));
    const tasksHtml = todayEntry && todayEntry.tasks && todayEntry.tasks.length
      ? todayEntry.tasks.map(t=>`<div class="line">• ${esc(t.title||'(未命名)')}</div>`).join('')
      : '<div class="line" style="color:var(--muted)">还没有记录，去「记录」写一条吧</div>';
    const moodEmoji = todayEntry && todayEntry.mood ? MOODS[todayEntry.mood-1] : '—';
    const stars = todayEntry && todayEntry.score ? '★'.repeat(todayEntry.score) : '';
    $('#todayCard').innerHTML = `
      <h2 class="serif">今日记录</h2>
      ${tasksHtml}
      <div class="dash-row" style="margin-top:6px"><span>心情 / 打分</span><b>${moodEmoji} ${stars||'未评'}</b></div>
      <button class="btn ghost small" data-go="tasks" style="margin-top:10px">去记录 →</button>`;
  }

  /* ---------- 回顾 ---------- */
  function toggleReviewSeg(){
    $('#segReport').classList.toggle('on', reviewSub==='report');
    $('#segHistory').classList.toggle('on', reviewSub==='history');
    $('#segLearned').classList.toggle('on', reviewSub==='learned');
    $('#reviewReport').hidden = reviewSub!=='report';
    $('#reviewHistory').hidden = reviewSub!=='history';
    $('#reviewLearned').hidden = reviewSub!=='learned';
  }
  $('#segReport').onclick = () => { reviewSub='report'; toggleReviewSeg(); };
  $('#segHistory').onclick = () => { reviewSub='history'; toggleReviewSeg(); };
  $('#segLearned').onclick = () => { reviewSub='learned'; toggleReviewSeg(); renderLearned(); };

  function renderLearned(){
    const box = $('#learnedList');
    const done = allItems().filter(it => planState[it.key]);
    if (!done.length) { box.innerHTML = '<div class="empty">还没有完成的计划。去「计划」完成第一项吧。</div>'; return; }
    const groups = {};
    done.forEach(it => {
      const cat = catOf(it.catId); const gname = cat ? cat.icon+' '+cat.name : '其它';
      (groups[gname] = groups[gname] || []).push(it);
    });
    box.innerHTML = Object.keys(groups).map(gname => {
      return `<div class="learned-group">
        <div class="learned-head">${esc(gname)}</div>
        ${groups[gname].map(it => {
          const d = detailStore[it.key] || {};
          const when = (typeof planState[it.key]==='string' && planState[it.key]) ? ' · '+planState[it.key] : '';
          const imgs = (d.images||[]).map(src=>`<div class="img-thumb"><img src="${src}" alt=""></div>`).join('');
          const notes = d.notes ? `<div class="learned-notes">${esc(d.notes)}</div>` : '';
          const review = d.review ? `<div class="learned-review">💬 ${esc(d.review)}</div>` : '';
          return `<div class="learned-card">
            <div class="learned-title">✓ ${esc(it.text)}<span class="learned-when">${when}</span></div>
            ${notes}${review}
            ${imgs ? `<div class="pd-imgs" style="margin-top:8px">${imgs}</div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
    }).join('');
  }

  function renderHistory(){
    const box = $('#historyList');
    if (!entries.length) { box.innerHTML='<div class="empty">还没有记录。去「记录」写第一条吧。</div>'; return; }
    box.innerHTML = entries.map(e => {
      const d = parse(e.date);
      const mood = e.mood ? MOODS[e.mood-1] : '';
      const star = e.score ? '★'.repeat(e.score) : '';
      const tasksHtml = (e.tasks||[]).map(t => `<div class="line">• ${esc(t.title||'(未命名任务)')}</div>`).join('');
      const vent = e.vent ? `<div class="line"><b>💬 吐槽</b>　${esc(e.vent)}</div>` : '';
      return `<div class="entry-card">
        <div class="head"><span class="d serif">${cnDate(d)}</span><span class="mood">${mood} ${star}</span></div>
        ${tasksHtml}${vent}
        <div class="ops"><button data-act="edit" data-id="${e.id}">编辑</button><button class="del" data-act="del" data-id="${e.id}">删除</button></div>
      </div>`;
    }).join('');
  }
  $('#historyList').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    const id = btn.dataset.id; const entry = entries.find(x=>x.id===id); if (!entry) return;
    if (btn.dataset.act==='del') { if (confirm('删除这条记录？')) { entries=entries.filter(x=>x.id!==id); saveEntries(); renderHistory(); toast('已删除'); } }
    else if (btn.dataset.act==='edit') { $('#fDate').value=entry.date; setDraft(entry, true); switchView('tasks'); toast('已载入「记录」页'); }
  });

  function renderReportMeta(){
    const {start,end}=weekRange();
    $('#reportRange').innerHTML = '本周：<b>'+cnDate(start).split(' · ')[0]+' – '+cnDate(end).split(' · ')[0]+'</b>';
  }
  function buildReport(lang){
    const {start,end}=weekRange();
    const list = weekEntries().sort((a,b)=> a.date<b.date?-1:1);
    if (!list.length) return lang==='zh' ? '本周还没有记录。' : 'No entries this week yet.';
    const head = lang==='zh'
      ? `📋 本周工作总结\n（${start.getMonth()+1}月${start.getDate()}日 – ${end.getMonth()+1}月${end.getDate()}日）`
      : `📋 Weekly Work Summary\n(${MON_EN[start.getMonth()]} ${start.getDate()} – ${MON_EN[end.getMonth()]} ${end.getDate()})`;
    const L = lang==='zh' ? {task:'任务', problem:'问题', thought:'感想'} : {task:'Task', problem:'Problem', thought:'Thoughts'};
    const body = list.map(e => {
      const d = parse(e.date);
      let s = `\n▎${lang==='zh'?cnDate(d):enDate(d)}`;
      (e.tasks||[]).forEach((t,i) => {
        s += `\n　${L.task}${(e.tasks.length>1)?(i+1):''}：${t.title||'(未命名)'}`;
        if (t.problems) s += `\n　　　${L.problem}：${t.problems}`;
        if (t.thoughts) s += `\n　　　${L.thought}：${t.thoughts}`;
      });
      return s;
    }).join('');
    return head + '\n' + body;
  }
  $('#genReportBtn').onclick = () => {
    reportZh = buildReport('zh');
    reportEn = '';
    reportLang = 'zh';
    $('#segZh').classList.add('on'); $('#segEn').classList.remove('on');
    $('#reportBox').textContent = reportZh;
    $('#reportBox').dataset.gen = '1';
    $('#copyBtn').disabled = false;
  };
  $('#segZh').onclick = () => {
    reportLang = 'zh';
    $('#segZh').classList.add('on'); $('#segEn').classList.remove('on');
    if ($('#reportBox').dataset.gen !== '1') return;
    if (!reportZh) reportZh = buildReport('zh');
    $('#reportBox').textContent = reportZh;
  };
  $('#segEn').onclick = () => {
    reportLang = 'en';
    $('#segEn').classList.add('on'); $('#segZh').classList.remove('on');
    if ($('#reportBox').dataset.gen !== '1') return;
    if (!reportZh) reportZh = buildReport('zh');
    if (!weekEntries().length) { $('#reportBox').textContent = buildReport('en'); return; }
    if (reportEn) { $('#reportBox').textContent = reportEn; return; }
    askConfirm('翻译周报', '将把本周摘要翻译成英文（会消耗少量 token），确认继续？', '确认翻译', async () => {
      $('#reportBox').textContent = '翻译中…';
      try {
        const { data, error } = await supabase.functions.invoke('ai', { body: { task: 'translate', text: reportZh } });
        if (error) throw error;
        reportEn = (data && data.translation) || '';
        $('#reportBox').textContent = reportEn || '（翻译失败，请重试）';
      } catch(err) {
        $('#reportBox').textContent = '翻译失败：' + ((err && err.message) || '请检查 AI 函数与登录状态');
      }
    });
  };

  $('#copyBtn').onclick = () => {
    const t = $('#reportBox').textContent;
    const done = () => toast('已复制到剪贴板 ✓'), fail = () => toast('复制失败，请手动全选复制');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t)?done():fail());
    else fallbackCopy(t)?done():fail();
  };
  function fallbackCopy(text){ try { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok; } catch(e){ return false; } }

  /* ---------- 设置 / 退出登录 ---------- */
  $('#gearBtn').onclick = () => { $('#settingsEmail').textContent = '登录邮箱：' + (currentEmail || ''); $('#settingsModal').classList.add('show'); };
  $('#closeSettings').onclick = () => $('#settingsModal').classList.remove('show');
  $('#signOutBtn').onclick = async () => {
    await supabase.auth.signOut();
    location.reload();
  };

  ensureSession();
})();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
